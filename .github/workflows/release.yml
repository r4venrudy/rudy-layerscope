name: Package preview
on:
  push:
    tags: ['v*']
permissions:
  contents: read
# Do not overlap publication attempts for the same release ref.
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.x'
          cache: false
      - name: Verify tag matches source version
        shell: bash
        run: test "$(go run ./cmd/layerscope version)" = "Rudy LayerScope ${GITHUB_REF_NAME#v}"
      - run: go vet ./...
      - run: go test ./...
      - run: go run scripts/package.go --out artifacts/release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: package-${{ runner.os }}-${{ runner.arch }}
          path: artifacts/release/*
          if-no-files-found: error
  publish:
    needs: package
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: package-*
          path: artifacts/release
          merge-multiple: true
      - name: Verify and combine checksums
        shell: bash
        working-directory: artifacts/release
        run: |
          cat *.sha256 | sort -k2 > SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          name: Rudy LayerScope ${{ github.ref_name }}
          body_path: docs/RELEASE_NOTES.md
          prerelease: true
          files: |
            artifacts/release/*.zip
            artifacts/release/SHA256SUMS
