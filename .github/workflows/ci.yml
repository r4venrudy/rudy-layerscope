name: Build and verify
on:
  push:
  pull_request:
permissions:
  contents: read
# Replace stale PR checks without canceling push, manual, or release runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.x'
          cache: false
      - name: Format
        shell: bash
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test '-coverprofile=coverage.out' ./...
      - name: Race detector
        if: runner.os == 'Linux'
        run: go test -race ./...
      - name: Bounded fuzz smoke
        if: runner.os == 'Linux'
        shell: bash
        run: |
          go test -run='^$' -fuzz=FuzzNormalizePath -fuzztime=5s -parallel=2 .
          go test -run='^$' -fuzz=FuzzJSON -fuzztime=5s -parallel=2 .
          go test -run='^$' -fuzz=FuzzLayer -fuzztime=5s -parallel=2 .
      - name: Native package and exact-binary smoke
        run: go run scripts/package.go --out artifacts/ci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: layerscope-${{ runner.os }}-${{ runner.arch }}
          path: artifacts/ci/*
          if-no-files-found: error
